services:
  # Database Service
  mongodb:
    image: mongo:latest
    restart: always
    volumes:
      - mongo-data:/data/db

  # Backend Service
  backend:
    build: ./backend
    restart: always
    ports:
      - "5002:5002"
    depends_on:
      - mongodb

  # Frontend Service
  frontend:
    build:
      context: ./frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

# Persistent storage for MongoDB
volumes:
  mongo-data:
