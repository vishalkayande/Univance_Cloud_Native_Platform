services:
  # Database Service
  mongodb:
    image: mongo:latest
    restart: always
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # Backend Service
  backend:
    build: ./backend
    restart: always
    ports:
      - "5002:5002"
    depends_on:
      mongodb:
        condition: service_healthy
    env_file:
      - ./.env
    environment:
      - PORT=5002
      - MONGODB_URI=mongodb://mongodb:27017/univance
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5002/api/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # Frontend Service
  frontend:
    build:
      context: ./frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

# Shared network for all services
networks:
  app-network:
    driver: bridge

# Persistent storage for MongoDB
volumes:
  mongo-data:
