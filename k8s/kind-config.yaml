kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: univance-cluster
nodes:
  - role: control-plane
    extraPortMappings:
      # Expose host port 80 to container NodePort 30080 (Frontend)
      - containerPort: 30080
        hostPort: 80
        protocol: TCP
      # Expose host port 5002 to container NodePort 30081 (Backend direct access if needed)
      - containerPort: 30081
        hostPort: 5002
        protocol: TCP
  - role: worker
  - role: worker
